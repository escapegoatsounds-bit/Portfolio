canvas{width:100%;height:100%;object-fit:contain;cursor:crosshair;touch-action:none}

<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=960,H=540,GY=470;                      // ground Y
// draw at twice the logical size so everything stays sharp when the canvas is scaled up
const DPR=2; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingQuality='high';
const UF="Inter,system-ui,sans-serif", TF="Bungee,Inter,system-ui,sans-serif";
const GOLD='#f0c233',PURP='#8b5cf6',PINK='#ff7ad9';
let scene='menu', score=0, level=1, bonesLeft=5, best=+(localStorage.bt_best||0);
let mode='brawl';                               // 'brawl' = Alley Brawler · 'bone' = classic Bone Toss
let bone=null, blocks=[], drag=null, fetchDog=null, msg='', msgT=0, won=false;

const skX=60;                                   // skippy idle x
const sling={x:150,y:GY-90};

function emoji(e,x,y,s,rot){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.font=s+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,0,0);ctx.restore();}
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}

/* ---------- levels: stacks of crates + BRIEF targets ---------- */
function buildLevel(n){
  blocks=[]; bonesLeft=5; won=false;
  const base=700;
  const add=(x,y,t)=>blocks.push({x,y:GY-y,w:46,h:46,vx:0,vy:0,t,dead:false});
  if(n===1){ add(base,46,'crate');add(base+50,46,'crate');add(base+25,92,'brief');
             add(base+120,46,'brief'); }
  if(n===2){ add(base-40,46,'crate');add(base+10,46,'brief');add(base+60,46,'crate');
             add(base-15,92,'brief');add(base+35,92,'crate');add(base+10,138,'brief'); }
  if(n===3){ for(let i=0;i<4;i++)add(base-60+i*50,46,i%2?'brief':'crate');
             for(let i=0;i<3;i++)add(base-35+i*50,92,i%2?'crate':'brief');
             add(base+15,138,'brief');add(base-10,184,'vinyl'); }
  newBone();
}
function newBone(){ bone={x:sling.x,y:sling.y,vx:0,vy:0,rot:0,flying:false,rest:false}; }

/* ---------- input ---------- */
function evPos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  // object-fit:contain mapping
  const sc=Math.min(r.width/W,r.height/H),ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;
  return{x:(t.clientX-r.left-ox)/sc,y:(t.clientY-r.top-oy)/sc};}
const inR=(p,x,y,w,h)=>p.x>x&&p.x<x+w&&p.y>y&&p.y<y+h;
function down(e){const p=evPos(e);
  if(scene==='menu'){
    for(let i=0;i<GAMES.length;i++)if(inR(p,CARD.x,CARD.y+i*(CARD.h+CARD.gap),CARD.w,CARD.h)){SFX.select();GAMES[i].go();return;}
    for(const b of MBTN)if(inR(p,b.x,MBTN_Y,b.w,40)){SFX.select();b.act();return;}
    if(inR(p,14,H-46,160,32))scene='skills';
    return;}
  if(scene==='skills'){if(inR(p,W/2-110,H-78,220,44))scene='menu';return;}
  if(scene==='controls'){if(inR(p,W/2-110,H-70,220,44))scene='menu';return;}
  if(scene==='over'){scene='menu';score=0;level=1;return;}
  if(IN_GAME.test(scene)&&inR(p,W-150,10,38,32)){toggleMusic();return;}
  if(scene==='menu'&&inR(p,SB_MENU.x,SB_MENU.y,38,32)){toggleMusic();return;}
  if(inR(p,W-104,10,94,32)){scene='menu';return;}            // in-game MENU button
  if(scene==='brawl'){brJump();return;}                      // tap/click = jump
  if(scene==='cross'){if(p.x<W*.33)crossMove(-1,0);else if(p.x>W*.67)crossMove(1,0);else crossMove(0,1);return;}
  if(scene==='rash'&&RS){RS.touch=p.x<W*.33?-1:p.x>W*.67?1:0;if(!RS.touch)rashPunch();return;}
  if(scene==='play'&&bone&&!bone.flying&&!fetchDog&&Math.hypot(p.x-bone.x,p.y-bone.y)<70)drag=p;}
function move(e){HOVER=evPos(e);if(drag){drag=evPos(e);e.preventDefault();}}
function up(){
  if(RS)RS.touch=0;
  if(drag&&bone){
    let dx=sling.x-drag.x,dy=sling.y-drag.y;
    const pow=Math.min(Math.hypot(dx,dy),140)/Math.max(Math.hypot(dx,dy),.01);
    bone.vx=dx*pow*.16; bone.vy=dy*pow*.16;
    if(Math.hypot(bone.vx,bone.vy)>2){bone.flying=true;bonesLeft--;SFX.whoosh();}
    else{bone.x=sling.x;bone.y=sling.y;}
  }
  drag=null;}
cv.addEventListener('mousedown',down);cv.addEventListener('mousemove',move);addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:true});cv.addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up);

/* ---------- physics ---------- */
function step(){
  if(scene!=='play')return;
  if(bone&&bone.flying&&!bone.rest){
    bone.vy+=.42; bone.x+=bone.vx; bone.y+=bone.vy; bone.rot+=bone.vx*.04;
    if(bone.y>GY-12){bone.y=GY-12;bone.vy*=-.45;bone.vx*=.7;if(Math.abs(bone.vy)<1.6)bone.vy=0;}
    if(Math.abs(bone.vx)<.25&&bone.vy===0&&bone.y>=GY-13)bone.rest=true;
    if(bone.x>W+60||bone.x<-60)bone.rest=true;
    // collisions
    for(const b of blocks){if(b.dead)continue;
      if(bone.x>b.x-10&&bone.x<b.x+b.w+10&&bone.y>b.y-10&&bone.y<b.y+b.h+10){
        b.vx+=bone.vx*.55;b.vy+=bone.vy*.35-2;
        bone.vx*=.55;bone.vy*=-.3;
        hit(b);
      }}
    if(bone.rest&&!fetchDog)fetchDog={x:skX,phase:'go',hasBone:false};
  }
  for(const b of blocks){if(b.dead)continue;
    b.vy+=.42;b.x+=b.vx;b.y+=b.vy;b.vx*=.985;
    let floor=GY-b.h;
    for(const o of blocks){if(o===b||o.dead)continue;
      if(b.x+b.w>o.x+6&&b.x<o.x+o.w-6&&b.y+b.h<=o.y+12&&b.y+b.h+b.vy>=o.y-2)floor=Math.min(floor,o.y-b.h);}
    if(b.y>floor){b.y=floor;if(Math.abs(b.vy)>3.5)hit(b);b.vy=0;}
    if(b.x>W+40||b.x<-60)kill(b);
  }
  if(fetchDog){const f=fetchDog,tx=f.phase==='go'?bone.x:skX;
    f.x+=(tx-f.x)*.06+(tx>f.x?1.6:-1.6);
    if(f.phase==='go'&&Math.abs(f.x-bone.x)<18){f.phase='back';f.hasBone=true;}
    if(f.phase==='back'&&Math.abs(f.x-skX)<14){fetchDog=null;
      if(blocks.every(b=>b.dead||b.t!=='brief')){lvlClear();}
      else if(bonesLeft<=0){gameOver(false);}
      else newBone();
    }}
}
function hit(b){SFX.thud();if(b.t==='brief'){kill(b);score+=100;flash('+100');SFX.ding();}
  else if(b.t==='vinyl'){kill(b);score+=250;flash('+250 VINYL!');}
  else{score+=10;}}
function kill(b){if(!b.dead){b.dead=true;}}
function lvlClear(){score+=bonesLeft*50;
  if(level>=3){gameOver(true);}else{level++;flash('LEVEL '+level+'!');buildLevel(level);}}
function gameOver(w){if(w)SFX.win();else SFX.lose();won=w;best=Math.max(best,score);localStorage.bt_best=best;scene='over';}
function flash(t){msg=t;msgT=90;}

/* ---------- character sprites: real art, white background keyed out at load ---------- */
function loadSprite(src,opt){
  opt=opt||{};
  const sp={cv:null,ready:false,w:1,h:1};
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
    const x=c.getContext('2d');x.drawImage(img,0,0);
    try{
      const id=x.getImageData(0,0,c.width,c.height),d=id.data,w=c.width,h=c.height;
      const seen=new Uint8Array(w*h),st=[];
      const isBg=i=>d[i]>222&&d[i+1]>222&&d[i+2]>222;            // near-white = background
      const push=(ax,ay)=>{if(ax<0||ay<0||ax>=w||ay>=h)return;const p=ay*w+ax;if(seen[p])return;seen[p]=1;st.push(p);};
      for(let i=0;i<w;i++){push(i,0);push(i,h-1);}
      for(let j=0;j<h;j++){push(0,j);push(w-1,j);}
      while(st.length){const p=st.pop(),i=p*4;if(!isBg(i))continue;d[i+3]=0;const ax=p%w,ay=p/w|0;push(ax+1,ay);push(ax-1,ay);push(ax,ay+1);push(ax,ay-1);}
      if(opt.cropL||opt.cropR){const _x0=(opt.cropL||0)*w,_x1=w-(opt.cropR||0)*w;
        for(let p=0;p<w*h;p++){const ax=p%w;if(ax<_x0||ax>=_x1)d[p*4+3]=0;}}
      x.putImageData(id,0,0);
      // true character bounds (ignore transparent padding) so feet/centre anchor exactly
      let mnx=w,mny=h,mxx=0,mxy=0,any=false;
      for(let p=0;p<w*h;p++){if(d[p*4+3]>10){any=true;const ax=p%w,ay=p/w|0;if(ax<mnx)mnx=ax;if(ax>mxx)mxx=ax;if(ay<mny)mny=ay;if(ay>mxy)mxy=ay;}}
      sp.bb=any?{x:mnx,y:mny,w:mxx-mnx+1,h:mxy-mny+1}:{x:0,y:0,w:c.width,h:c.height};
    }catch(_){sp.bb={x:0,y:0,w:c.width,h:c.height};}
    sp.cv=c;sp.w=c.width;sp.h=c.height;sp.ready=true;
  };
  img.src=src;
  return sp;
}

  if(scene==='cross'){const m={ArrowUp:[0,1],KeyW:[0,1],ArrowDown:[0,-1],KeyS:[0,-1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[e.code];

function brAttack(){
  const p=BR&&BR.p; if(!p||BR.atk>0||BR.skAtk)return;
  BR.atk=ATK_T;
  // find nearest live enemy in front of the player
  const ens=BR.ens.filter(e=>!e.dead&&(e.x-p.x)*p.face>-30);
  if(ens.length){
    ens.sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x));
    const t=ens[0];
    BR.skAtk={tx:t.x,eid:BR.ens.indexOf(t),x:BR.sk.x,returning:false,done:false};SFX.bark();

function brMelee(reach,dmg,word){
  const p=BR.p; let hit=false;
  for(const e of BR.ens){ if(e.dead)continue;
    if((e.x-p.x)*p.face>-10&&Math.abs(e.x-p.x)<reach&&Math.abs((GY-30)-p.y)<75){

      if(e.hp<=0){e.dead=true;score+=dmg>1?70:50;SFX.boom();} } }

}

/* ════════ HIGHWAY RASH — motorbike race down a desert highway ════════

const RSTART=150;                                         // 3 · 2 · 1 · GO
function rashStep(){
  const R=RS; if(!R||R.done)return;
  R.t++;
  const L=KEY.ArrowLeft||KEY.KeyA||R.touch<0, Rt=KEY.ArrowRight||KEY.KeyD||R.touch>0;
  const brake=KEY.ArrowDown||KEY.KeyS, boost=KEY.ArrowUp||KEY.KeyW;
  const pct=R.speed/RMAX, seg=rSeg(R.pos+R.playerZ);
  if(R.t===RSTART)SFX.go();
  SFX.engine(Math.min(1,R.speed/RMAX));
  if(R.t<RSTART){ R.speed=0; if(R.t%(RSTART/3|0)===1)SFX.beep(); }
  else if(R.crash>0){ R.crash--; R.speed*=0.95; }
  else{
    const dx=Math.max(pct,.25)*0.034;
    if(L)R.x-=dx; if(Rt)R.x+=dx;
    R.x-=dx*pct*seg.curve*0.16;                           // bends pull the bike outward
    if(brake)R.speed-=RMAX/50; else R.speed+=boost?RMAX/120:RMAX/190;
    if(Math.abs(R.x)>1&&R.speed>RMAX/3)R.speed-=RMAX/80;  // sand slows the bike
  }
  R.x=Math.max(-2.3,Math.min(2.3,R.x));
  R.speed=Math.max(0,Math.min(boost&&R.crash<=0?RMAX*1.08:RMAX,R.speed));
  R.pos+=R.speed; R.sky+=seg.curve*pct*0.9;
  if(R.punch>0)R.punch--; if(R.kick>0)R.kick--; if(R.wob>0)R.wob--;
  if(Math.abs(R.x)>1&&R.speed>RMAX*.3&&FRAME%3===0)puff(W/2+(Math.random()-.5)*120,H-30,3,'rgba(214,180,120,.9)',4);   // sand spray
  const pz=R.pos+R.playerZ;
  // palms and billboards off the road
  if(Math.abs(R.x)>1.05&&R.crash<=0)
    for(const s of seg.spr) if((s.k==='palm'&&Math.abs(s.x-R.x)<0.22)||(s.k==='bill'&&Math.abs(s.x-R.x)<0.5)){ rCrash(18,'CRASH!'); break; }
  // traffic
  for(const c of R.cars){
    if(c.z<R.finish*RSEG)c.z+=c.sp;
    if(R.crash<=0&&Math.abs(c.z-pz)<RSEG*0.9&&Math.abs(c.x-R.x)<(c.truck?0.42:0.34)&&R.speed>c.sp){ R.speed=c.sp*0.6; rCrash(15,'BUMPED!'); }
  }
  // the other riders
  for(const r of R.rivals){
    if(R.t<RSTART)continue;
    if(r.down>0){ r.down--; r.sp*=0.92; if(r.down===0)r.hp=3; }
    else{
      const gap=(r.z-pz)/RSEG, rub=gap<-30?1.12:gap>45?0.9:1;           // keep the pack together
      r.sp+=(r.top*rub-r.sp)*0.02;
      if(Math.random()<0.004)r.tx=[-0.6,0,0.6][Math.random()*3|0];
      for(const c of R.cars) if(c.z>r.z&&c.z-r.z<RSEG*6&&Math.abs(c.x-r.x)<0.4) r.tx=c.x>0?c.x-0.66:c.x+0.66;
      r.x+=(r.tx-r.x)*0.03;
      const near=Math.abs(r.z-pz)<RSEG*1.1&&Math.abs(r.x-R.x)<0.42;
      if(r.cool>0)r.cool--;
      if(near&&r.cool===0&&R.crash<=0){
        r.punch=14; r.side=R.x>r.x?1:-1; r.cool=100+(Math.random()*70|0);
        R.hp-=7; R.wob=18; R.x+=r.side*0.08; msg=r.name+' HITS YOU!'; msgT=22; SFX.punch(); SFX.hurt();
        if(R.hp<=0){ rEnd(false,'WIPED OUT'); return; }
      }
    }
    if(r.punch>0)r.punch--;
    r.z+=r.sp;
  }
  // potholes jolt you if you ride into them; bumps only if you take them fast
  for(const h of R.haz){ if(h.hit||Math.abs(h.z-pz)>RSEG*.5)continue;
    if(h.k==='hole'&&Math.abs(h.x-R.x)<0.22&&R.crash<=0){ h.hit=true; R.speed*=0.65; R.hp-=8; R.wob=26; msg='حفرة! POTHOLE'; msgT=30; SFX.thud(); SFX.hurt(); if(R.hp<=0){rEnd(false,'WIPED OUT');return;} }
    if(h.k==='bump'&&Math.abs(R.x)<1.05){ h.hit=true;
      if(R.speed>RMAX*.6){ R.speed*=0.55; R.hp-=6; R.wob=30; R.jolt=14; msg='مطب! SLOW DOWN'; msgT=34; SFX.thud(); SFX.land(); if(R.hp<=0){rEnd(false,'WIPED OUT');return;} }
      else { R.jolt=6; SFX.land(); } } }
  if(R.jolt>0)R.jolt--;

  for(const v of R.pick) if(!v.got&&Math.abs(v.z-pz)<RSEG&&Math.abs(v.x-R.x)<0.26){ v.got=true; score+=50; gotLike(W/2,H-230); R.speed=Math.min(RMAX*1.15,R.speed+RMAX*0.15); }
  if(pz>=R.finish*RSEG)rEnd(true);
}

/* ════════ CROSS CAIRO — get across the crowded streets ════════

   tuk-tuks, black-and-white taxis, microbuses, scooters, motorbikes and the
   foul cart; women cross the streets too; the Nile has feluccas to ride.

    else if(prev[prev.length-1]==='nile')type='walk';                               // the Corniche after the river
    else if(prev[prev.length-1]==='walk')type='road';
    else if(prev.filter(t=>t==='road').length>=3)type='walk';
    else type=Math.random()<.78?'road':'walk';

    const k=kinds[Math.random()*kinds.length|0];
    const sp={toktok:1.7,taxi:3.1,micro:2.3,scooter:3.4,moto:4.4,foul:.8,woman:.7}[k]*(1+lvl*.7)*(.85+Math.random()*.3);
    const w={toktok:76,taxi:112,micro:136,scooter:52,moto:62,foul:150,woman:30}[k];

function crossDraw(){
  const C=CR, camRow=C.cam/CROW;
  // sky, the Cairo skyline on the horizon, haze
  const g=ctx.createLinearGradient(0,0,0,CHOR);g.addColorStop(0,'#3f9dff');g.addColorStop(1,'#d9efff');ctx.fillStyle=g;ctx.fillRect(0,0,W,CHOR+2);
  ctx.save();ctx.shadowColor='#fff6b0';ctx.shadowBlur=40;ctx.fillStyle='#fff1a0';ctx.beginPath();ctx.arc(W-120,56,30,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(0,CHOR+4-(GY-96));cairoSkyline(C.x*.2+200);ctx.restore();
  const first=Math.max(0,Math.floor(camRow)-1),last=first+40;
  while(C.rows.length<=last+2)crossRow();
  for(let i=last;i>=first;i--){
    const r=C.rows[i],d0=i-camRow,d1=d0+1; if(d1<=-1)continue;
    const y1=cY(Math.max(d0,-.99)),y2=cY(d1);
    // the ground band for this row
    if(r.type==='road'){
      cQuad([0,y1],[W,y1],[W,y2],[0,y2],((i%2)?'#5a5c62':'#55575c'));
      for(let x=-400;x<W+400;x+=90){const a=cX(x,d0+.46),b=cX(x+44,d0+.46),a2=cX(x,d0+.54),b2=cX(x+44,d0+.54);cQuad([a,cY(d0+.46)],[b,cY(d0+.46)],[b2,cY(d0+.54)],[a2,cY(d0+.54)],'rgba(255,255,255,.55)');}
    }else if(r.type==='nile'){
      cQuad([0,y1],[W,y1],[W,y2],[0,y2],'#2f7fc1');
      for(let x=-400+((C.t*.8+i*30)%60);x<W+400;x+=60){const a=cX(x,d0+.5),b=cX(x+26,d0+.5);px(a,cY(d0+.5),b-a,2,'rgba(255,255,255,.45)');}
    }else{
      cQuad([0,y1],[W,y1],[W,y2],[0,y2],'#d9c7a5');
      for(let x=-480;x<W+480;x+=48)cQuad([cX(x,d0),y1],[cX(x+1.5,d0),y1],[cX(x+1.5,d1),y2],[cX(x,d1),y2],'rgba(0,0,0,.09)');
      px(0,y1-5*cS(d0),W,5*cS(d0),'#b7a37e');                                                    // kerb
    }
    // buildings and palms beyond the play area on pavement rows
    if(r.type==='walk'&&d0>-.6){
      if(C.rows[i-1]&&C.rows[i-1].type==='nile'){cPalm(cX(-60,d0+.5),cY(d0+.5),cS(d0+.5));cPalm(cX(W+60,d0+.5),cY(d0+.5),cS(d0+.5));}
      else{cBlock(i,d0,-620,-80);cBlock(i+1,d0,W+80,W+620);}
    }
    if(r.like&&!r.like.got){const dm=d0+.5,b=Math.sin(C.t*.12+i)*3;ctx.save();ctx.shadowColor='#ff2d55';ctx.shadowBlur=10;likeIcon(cX(r.like.x,dm),cY(dm)-16*cS(dm)+b,13*cS(dm));ctx.restore();}
    const dm=d0+.55,sc=cS(dm),yb=cY(dm);
    for(const o of r.items){ if(o.fixed)cProp(o,cX(o.x,dm),yb,sc); else cVehicle(o,cX(o.x,dm),yb-(r.type==='nile'?10*sc:0),r.dir,sc); }
    if(i===C.row)crossPlayer(i);
  }
  // HUD
  px(0,0,W,46,'rgba(10,6,20,.62)');
  ctx.fillStyle=GOLD;ctx.font='bold 18px '+UF;ctx.fillText('SCORE '+score,18,31);

  likeCounter();likeFx();soundBtn();
  px(W-104,10,94,32,'rgba(139,92,246,.35)');ctx.strokeStyle=PURP;ctx.strokeRect(W-104,10,94,32);
  ctx.fillStyle='#fff';ctx.font='bold 14px '+UF;ctx.fillText('MENU',W-86,31);
  ctx.fillStyle='rgba(10,6,20,.55)';ctx.fillRect(0,H-24,W,24);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='11px '+UF;
  ctx.fillText('↑ forward  ↓ back  ← → sidestep  N sound  ·  touch: tap the middle to go forward, the sides to sidestep',14,H-8);
  if(msgT>0){msgT--;ctx.textAlign='center';ctx.fillStyle=PINK;ctx.font='bold '+(24+msgT/6)+'px '+UF;ctx.fillText(msg,W/2,110);ctx.textAlign='left';}

function crossPlayer(row){
  const C=CR; if(C.inv>0&&(FRAME>>2)%2)return;
  const q=crossProj(row+.55,C.x), hopY=C.hop>0?-Math.sin(C.hop/8*Math.PI)*18*q.s:0;
  if(C.dead>0){emoji(C.splash>0?'💦':'💥',q.x,q.y-30*q.s,44*q.s);return;}
  ctx.save();ctx.translate(q.x,q.y);ctx.scale(q.s,q.s);cShadow(40,q.s);ctx.restore();
  const sp=SPR.goatRider;
  if(sp&&sp.ready&&sp.bb){const bb=sp.bb,h=96*q.s,w=h*bb.w/bb.h;
    ctx.save();ctx.translate(q.x,q.y+hopY);if(C.dir<0)ctx.scale(-1,1);ctx.drawImage(sp.cv,bb.x,bb.y,bb.w,bb.h,-w/2,-h,w,h);ctx.restore();}
  else emoji('🐐',q.x,q.y-20+hopY,34);
}

  if(scene==='brawl'){brawlDraw();return;}

  if(fetchDog){dog(fetchDog.x,GY-24,40);if(fetchDog.hasBone)boneDraw(fetchDog.x+16,GY-34,0,22);
    ctx.fillStyle=PINK;ctx.font='bold 12px '+UF;ctx.fillText('FETCH!',fetchDog.x-18,GY-56);}

}

function applyGameHash(){
  if(location.hash.includes('bonetoss')){mode='bone';score=0;level=1;scene='play';buildLevel(1);}
  else if(location.hash.includes('cross')){mode='cross';score=0;LIKES=0;scene='cross';crossInit();}
  else if(location.hash.includes('rash')){mode='rash';score=0;LIKES=0;scene='rash';rashInit();}
  else if(location.hash.includes('play')){mode='brawl';score=0;scene='brawl';brawlInit(1);}
  else if(location.hash.includes('skills')){scene='skills';}
  else if(location.hash.includes('menu')){scene='menu';}
}
applyGameHash();
window.addEventListener('hashchange',applyGameHash);
